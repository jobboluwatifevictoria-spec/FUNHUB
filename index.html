      /* Hero Container */
      .hero-container {
        position: relative;
        width: 100%;
        height: 100vh; /* Adjusts to fit under the 12vh total navbars */
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      /* Video Background Wrapper */
      .video-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }

      .video-wrapper iframe {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100vw;
        height: 56.25vw; /* 16:9 Aspect Ratio */
        min-height: 100%;
        min-width: 177.77vh; /* Keeps video filling the container */
        transform: translate(-50%, -50%);
      }

      /* Dark Overlay */
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(11, 16, 32, 0.7) 0%,
          rgba(11, 16, 32, 0.85) 100%
        );
        z-index: 2;
      }

      /* Hero Content (Logo, Text, Button) */
      .hero-content {
        position: relative;
        z-index: 3;
        max-width: 800px;
        padding: 0 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

        .funhub-logo {

    letter-spacing: 3px;
    color: #f59e0b;
    text-transform: uppercase;
    padding-left: 100px;
    text-shadow:
      3px 3px 0 #0f172a,
      6px 6px 0 rgba(0, 0, 0, 0.35),
      0 0 18px rgba(245, 158, 11, 0.25);
    -webkit-text-stroke: 2px #1e293b;
    filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.35));
    transform: perspective(700px) rotateX(8deg);
  }

      .hero-btn:hover {

        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
      }

      .hero-btn:active {
        transform: translateY(-1px);
