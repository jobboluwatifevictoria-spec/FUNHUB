<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Ticket - FUNHUB</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b1020 0%, #141b2d 45%, #1f2937 100%);
      min-height: 100vh;
      color: #e5e7eb;
    }

    /* =======================
       HEADER
    ======================= */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 7vh;
      background-color: #162b5f;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .funhub-logo {
      display: inline-block;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #f59e0b;
      text-transform: uppercase;
      text-shadow:
        3px 3px 0 #000000,
        6px 6px 0 rgba(226, 183, 102, 0.35),
        0 0 18px rgba(0, 0, 0, 0.25);
      -webkit-text-stroke: 1.5px #8a5e3b;
      text-decoration: none;
    }

    header a.back-link {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    header a.back-link:hover {
      color: #f59e0b;
    }

    .page-intro {
      text-align: center;
      padding: 50px 5% 20px;
    }

    .page-intro h1 {
      color: #f59e0b;
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .page-intro p {
      color: #9ca3af;
    }

    /* =======================
       RECEIPT / TICKET STUB
    ======================= */
    .receipt-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 5% 90px;
    }

    .ticket {
      width: 100%;
      max-width: 400px;
      background: #f8fafc;
      color: #111827;
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      position: relative;
    }

    .ticket-main {
      padding: 26px 26px 20px;
    }

    .ticket-brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .ticket-brand .brand-name {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #d97706;
      text-transform: uppercase;
    }

    .ticket-brand .admit-one {
      font-size: 10px;
      letter-spacing: 2px;
      color: #6b7280;
      text-transform: uppercase;
      border: 1px solid #d1d5db;
      padding: 4px 8px;
      border-radius: 999px;
    }

    .ticket-movie {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .ticket-tagline {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 18px;
    }

    .ticket-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 10px;
    }

    .ticket-field {
      display: flex;
      flex-direction: column;
    }

    .ticket-field .label {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 3px;
    }

    .ticket-field .value {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
    }

    .ticket-field.full {
      grid-column: 1 / -1;
    }

    /* Perforation between the main ticket body and the stub */
    .perforation {
      position: relative;
      height: 0;
      border-top: 2px dashed #cbd5e1;
      margin: 22px 0 0;
    }

    .perforation::before,
    .perforation::after {
      content: "";
      position: absolute;
      top: -11px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #0b1020;
    }

    .perforation::before {
      left: -37px;
    }

    .perforation::after {
      right: -37px;
    }

    .ticket-stub {
      padding: 18px 26px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
    }

    .stub-seat .label {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .stub-seat .seat-value {
      font-size: 30px;
      font-weight: 900;
      color: #d97706;
      line-height: 1.1;
    }

    .stub-id {
      text-align: right;
    }

    .stub-id .label {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .stub-id .value {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
    }

    .barcode {
      height: 34px;
      margin: 16px 26px 22px;
      background: repeating-linear-gradient(
        90deg,
        #111827 0px,
        #111827 2px,
        transparent 2px,
        transparent 5px,
        #111827 5px,
        #111827 6px,
        transparent 6px,
        transparent 10px
      );
    }

    .ticket-status {
      text-align: center;
      padding: 10px;
      background: #16a34a;
      color: white;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .receipt-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
      max-width: 400px;
      width: 100%;
    }

    .action-btn {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: 0.2s ease;
    }

    .print-btn {
      background: #f59e0b;
      color: #111827;
    }

    .print-btn:hover {
      filter: brightness(1.08);
    }

    .again-btn {
      background: transparent;
      border: 2px solid #4b5563;
      color: #e5e7eb;
    }

    .again-btn:hover {
      border-color: #f59e0b;
      color: #f59e0b;
    }

    @media (max-width: 480px) {
      .perforation::before {
        left: -11px;
      }
      .perforation::after {
        right: -11px;
      }
    }

    @media print {
      header,
      .page-intro,
      .receipt-actions {
        display: none !important;
      }
      body {
        background: white;
      }
      .receipt-wrap {
        padding: 0;
      }
    }
  </style>
  <body>
    <header>
      <a href="site.html" class="funhub-logo">FUNHUB</a>
      <a href="site.html" class="back-link">&larr; Back to browsing</a>
    </header>

    <div class="page-intro">
      <h1>🎫 Your Ticket</h1>
      <p>You're all set. Here's your booking confirmation.</p>
    </div>

    <!-- RECEIPT / TICKET -->
    <div class="receipt-wrap">
      <div class="ticket" id="receipt">
        <div class="ticket-main">
          <div class="ticket-brand">
            <span class="brand-name">FunHub</span>
            <span class="admit-one">Admit One</span>
          </div>

          <div class="ticket-movie" id="receiptMovie">Movie Title</div>
          <div class="ticket-tagline">Movie vibes, made fun and easy!!!</div>

          <div class="ticket-grid">
            <div class="ticket-field">
              <span class="label">Guest</span>
              <span class="value" id="receiptName">-</span>
            </div>
            <div class="ticket-field">
              <span class="label">Showtime</span>
              <span class="value" id="receiptShowtime">-</span>
            </div>
            <div class="ticket-field">
              <span class="label">Date</span>
              <span class="value" id="receiptDate">-</span>
            </div>
            <div class="ticket-field">
              <span class="label">Booked at</span>
              <span class="value" id="receiptTime">-</span>
            </div>
            <div class="ticket-field">
              <span class="label">Price</span>
              <span class="value" id="receiptPrice">-</span>
            </div>
            <div class="ticket-field">
              <span class="label">Booking ID</span>
              <span class="value" id="receiptBookingID">-</span>
            </div>
          </div>
        </div>

        <div class="perforation"></div>

        <div class="ticket-stub">
          <div class="stub-seat">
            <div class="label">Seat</div>
            <div class="seat-value" id="receiptSeat">-</div>
          </div>
          <div class="stub-id">
            <div class="label">Seat ID</div>
            <div class="value" id="receiptSeatID">-</div>
          </div>
        </div>

        <div class="barcode"></div>

        <div class="ticket-status">Paid</div>
      </div>

      <div class="receipt-actions">
        <button class="action-btn print-btn" id="printReceiptBtn">🖨️ Print Ticket</button>
        <button class="action-btn again-btn" id="bookAgainBtn">Book Another Seat</button>
      </div>
    </div>
  </body>

  <script>
    // Pull every saved booking, then find the one this page should show.
    // The URL tells us which ticket (?id=<bookingID>) - if there's no id,
    // fall back to showing the most recently booked ticket.
    const tickets = JSON.parse(localStorage.getItem("funhub-tickets") || "[]");
    const requestedID = new URLSearchParams(window.location.search).get("id");
    const ticket = requestedID
      ? tickets.find((t) => t.bookingID === requestedID)
      : tickets[tickets.length - 1];

    if (!ticket) {
     
      window.location.href = "booking.html";
    } else {
      document.getElementById("receiptMovie").textContent = ticket.movie;
      document.getElementById("receiptName").textContent = ticket.name;
      document.getElementById("receiptShowtime").textContent = ticket.showtime;
      document.getElementById("receiptDate").textContent = ticket.date;
      document.getElementById("receiptTime").textContent = ticket.time;
      document.getElementById("receiptPrice").textContent = `₦${ticket.price.toLocaleString()}`;
      document.getElementById("receiptBookingID").textContent = ticket.bookingID;
      document.getElementById("receiptSeat").textContent = ticket.seat;
      document.getElementById("receiptSeatID").textContent = ticket.seatID;
    }

    document.getElementById("printReceiptBtn").addEventListener("click", () => {
      window.print();
    });

    document.getElementById("bookAgainBtn").addEventListener("click", () => {
      window.location.href = "noo.html";
    });
  </script>
</html>
