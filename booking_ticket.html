<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FUNHUB Seat Booking</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: #0b1020;
        color: white;
        font-family: Arial, sans-serif;
        padding: 50px 5%;
      }

      .movie-card {
        width: min(280px, 100%);
        height: 410px;
        position: relative;
        overflow: hidden;
        border-radius: 20px;
        background: #1f2937;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      }

      .movie-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .movie-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 20px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.95));
      }

      .movie-overlay h2 {
        margin-bottom: 8px;
      }
      .movie-overlay p {
        color: #cbd5e1;
        margin-bottom: 16px;
        font-size: 14px;
      }

      .watch-btn,
      .book-btn,
      .free-watch-btn,
      .close-btn {
        border: none;
        border-radius: 9px;
        padding: 12px 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.25s ease;
      }

      .watch-btn,
      .book-btn {
        background: #f59e0b;
        color: #111827;
      }

      .watch-btn:hover,
      .book-btn:hover {
        background: #ffb000;
        transform: translateY(-2px);
      }

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.78);
      }

      .modal.show {
        display: flex;
      }

      .booking-box {
        width: min(470px, 100%);
        max-height: 90vh;
        overflow-y: auto;
        padding: 28px;
        border-radius: 24px;
        background: #111827;
        border: 1px solid #334155;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6);
      }

      .booking-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .booking-header h2 {
        color: #f59e0b;
      }

      .close-btn {
        padding: 7px 11px;
        background: #374151;
        color: white;
        font-size: 18px;
      }

      .close-btn:hover {
        background: #ef4444;
      }

      .booking-box > p {
        color: #cbd5e1;
        margin-bottom: 22px;
        font-size: 14px;
      }

      .screen-label {
        width: 80%;
        margin: 0 auto 28px;
        padding: 9px;
        border-radius: 50%;
        background: #334155;
        color: #e5e7eb;
        text-align: center;
        font-size: 12px;
        letter-spacing: 2px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      }

      .seat-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
        margin-bottom: 22px;
      }

      .seat {
        height: 38px;
        border: none;
        border-radius: 8px 8px 12px 12px;
        background: #1e9e66;
        color: white;
        font-size: 12px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .seat:hover:not(.taken) {
        transform: scale(1.08);
        background: #35c985;
      }
      .seat.selected {
        background: #f59e0b;
        color: #111827;
      }
      .seat.taken {
        background: #64748b;
        color: #cbd5e1;
        cursor: not-allowed;
        opacity: 0.7;
      }

      .seat-key {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        color: #cbd5e1;
        font-size: 12px;
        margin-bottom: 22px;
      }

      .key-item {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .key-color {
        width: 13px;
        height: 13px;
        border-radius: 4px;
      }
      .available {
        background: #1e9e66;
      }
      .selected-key {
        background: #f59e0b;
      }
      .taken-key {
        background: #64748b;
      }

      .booking-actions {
        display: grid;
        gap: 10px;
      }

      .free-watch-btn {
        background: transparent;
        color: white;
        border: 2px solid #f59e0b;
      }

      .free-watch-btn:hover {
        background: #f59e0b;
        color: #111827;
      }

      .status-message {
        min-height: 20px;
        margin-top: 16px;
        color: #fbbf24;
        text-align: center;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <article class="movie-card">
      <img
        src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=700&q=80"
        alt="Movie poster"
      />
      <div class="movie-overlay">
        <h2>Movie Night</h2>
        <p>Choose a seat or watch without booking.</p>
        <button class="watch-btn" id="watchNowButton">▶ Watch Now</button>
      </div>
    </article>

    <div class="modal" id="bookingModal">
      <div class="booking-box">
        <div class="booking-header">
          <h2>Book Your Seat</h2>
          <button class="close-btn" id="closeModal">×</button>
        </div>
        <p>Select an available seat before watching the movie.</p>

        <div class="screen-label">SCREEN</div>
        <div class="seat-grid" id="seatGrid"></div>

        <div class="seat-key">
          <span class="key-item"
            ><span class="key-color available"></span>Available</span
          >
          <span class="key-item"
            ><span class="key-color selected-key"></span>Selected</span
          >
          <span class="key-item"
            ><span class="key-color taken-key"></span>Taken</span
          >
        </div>

        <div class="booking-actions">
          <button class="book-btn" id="bookTicketButton">Book Ticket</button>
          <button class="free-watch-btn" id="watchWithoutBookingButton">
            Watch Without Booking
          </button>
        </div>
        <div class="status-message" id="statusMessage"></div>
      </div>
    </div>

    <script>
      const bookingModal = document.getElementById("bookingModal");
      const seatGrid = document.getElementById("seatGrid");
      const statusMessage = document.getElementById("statusMessage");
      const watchNowButton = document.getElementById("watchNowButton");
      const closeModal = document.getElementById("closeModal");
      const bookTicketButton = document.getElementById("bookTicketButton");
      const watchWithoutBookingButton = document.getElementById(
        "watchWithoutBookingButton",
      );

      // These seats are already occupied for this demonstration.
      const takenSeats = ["A2", "A5", "B3", "C1", "C6", "D4"];
      let selectedSeat = null;

      function createSeats() {
        const rows = ["A", "B", "C", "D"];
        seatGrid.innerHTML = "";

        rows.forEach((row) => {
          for (let number = 1; number <= 6; number++) {
            const seatName = row + number;
            const seatButton = document.createElement("button");
            seatButton.className = "seat";
            seatButton.textContent = seatName;
            seatButton.type = "button";

            if (takenSeats.includes(seatName)) {
              seatButton.classList.add("taken");
              seatButton.disabled = true;
              seatButton.title = "This seat is already taken";
            } else {
              seatButton.addEventListener("click", () =>
                selectSeat(seatButton, seatName),
              );
            }

            seatGrid.appendChild(seatButton);
          }
        });
      }

      function selectSeat(button, seatName) {
        document.querySelectorAll(".seat.selected").forEach((seat) => {
          seat.classList.remove("selected");
        });

        selectedSeat = seatName;
        button.classList.add("selected");
        statusMessage.textContent = `Seat ${seatName} selected.`;
      }

      watchNowButton.addEventListener("click", () => {
        selectedSeat = null;
        statusMessage.textContent = "";
        createSeats();
        bookingModal.classList.add("show");
      });

      closeModal.addEventListener("click", () => {
        bookingModal.classList.remove("show");
      });

      bookingModal.addEventListener("click", (event) => {
        if (event.target === bookingModal) {
          bookingModal.classList.remove("show");
        }
      });

      bookTicketButton.addEventListener("click", () => {
        if (!selectedSeat) {
          alert("Please select an available seat first.");
          return;
        }

        if (takenSeats.includes(selectedSeat)) {
          alert(`Seat ${selectedSeat} is already taken.`);
          return;
        }

        takenSeats.push(selectedSeat);
        alert(`Ticket booked successfully for seat ${selectedSeat}!`);
        bookingModal.classList.remove("show");
      });

      watchWithoutBookingButton.addEventListener("click", () => {
        alert("Enjoy the movie without booking a seat!");
        bookingModal.classList.remove("show");
      });
    </script>
  </body>
</html>
